name: TamaPoke visual pilot verification

# This isolated workflow checks the draft battle branch only. It never publishes
# installer files, pushes to the repository, or flashes any device.
on:
  pull_request:
    branches: [codex/pokemon-visual-pilot, codex/tamapoke-battle-scene-polish]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'TamaPoke.ino'
      - '*.h'
      - 'sdmon.cpp'
      - 'tools/emu/**'
      - 'tools/pack_portrait.py'
      - 'tools/pokemon_motion.py'
      - 'tools/bake_pokemon_walk.py'
      - 'tools/bulbasaur_walk_pilot.py'
      - 'tools/merge_walk_pilot.py'
      - 'tools/test_pokemon_motion.py'
      - 'tools/unpack_emulator_assets.py'
      - '.github/workflows/battle-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-visual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'codex/tamapoke-battle-scene-polish' || github.event.pull_request.head.ref == 'codex/tamapoke-hd-frame-fit'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install emulator dependency
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Restore existing sprite test fixtures
        run: python3 tools/unpack_emulator_assets.py --out tools/sdcard/mons web/sprites-*.pak
      - name: Check articulated gait mathematics
        run: python3 tools/test_pokemon_motion.py
      - name: Run real-source host tests
        run: |
          mkdir -p "$RUNNER_TEMP/battle-shots"
          WALK_SHOTS="$RUNNER_TEMP/battle-shots" bash tools/emu/tests/run.sh
      - name: Render battle and Pokedex screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/battle-shots"
          EMU="$PWD/tools/emu/tamapoke-emu"
          cd "$RUNNER_TEMP/battle-shots"
          for screen in btlmenu btlmoves btlswitch battleanim gallery gallerydetail; do
            rm -f tamapoke.nvs
            "$EMU" --shot "$screen" --lvl 30 --out "$screen.ppm"
            test -s "$screen.ppm"
          done
          test -s fishing.ppm
          test -s gallerydetail.ppm
          test -s treasure.ppm
          test -s treasure__opened_.ppm
      - name: Exercise four canonical official-artwork portraits
        if: github.event.pull_request.head.ref == 'codex/tamapoke-hd-frame-fit'
        run: |
          python3 -m venv "$RUNNER_TEMP/portrait-venv"
          "$RUNNER_TEMP/portrait-venv/bin/pip" install Pillow==11.3.0
          ROOT="$PWD"
          EMU="$ROOT/tools/emu/tamapoke-emu"
          mkdir -p "$RUNNER_TEMP/portrait-pilot"
          cd "$RUNNER_TEMP/portrait-pilot"
          for dex in 1 4 7 25; do
            rm -f tamapoke.nvs
            "$EMU" --shot portraitpilot --dex "$dex" --out "fallback-$dex.ppm"
            url="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/$dex.png"
            curl --fail --location --retry 2 --max-time 60 "$url" -o "$dex.png"
            "$RUNNER_TEMP/portrait-venv/bin/python" "$ROOT/tools/pack_portrait.py" "$dex.png" --dex "$dex" --source "$url" --rights "Copyright respective owners; temporary evaluation only; no redistribution" --out "$ROOT/tools/sdcard/mons"
            rm -f tamapoke.nvs
            "$EMU" --shot portraitpilot --dex "$dex" --out "portrait-$dex.ppm"
            test -s "portrait-$dex.ppm"
            if cmp -s "fallback-$dex.ppm" "portrait-$dex.ppm"; then
              echo "Portrait $dex did not change rendered frame"; exit 1
            fi
            echo "PASS: canonical portrait $dex changes real emulator frame"
          done
          # Do not publish the downloaded art or screenshots containing it.
          rm -f "$ROOT"/tools/sdcard/mons/*.tpa "$ROOT"/tools/sdcard/mons/portrait-manifest.json
          cd "$ROOT"
          rm -rf "$RUNNER_TEMP/portrait-pilot"
      # Rejected geometric artwork retained only as a historical engineering fixture.
      - name: Bake rejected historical animation fixture (manual only)
        if: github.event_name == 'workflow_dispatch' && false
        run: |
          "$RUNNER_TEMP/portrait-venv/bin/python" tools/bulbasaur_walk_pilot.py "$RUNNER_TEMP/battle-shots/bulbasaur"
          test -s "$RUNNER_TEMP/battle-shots/bulbasaur/bulbasaur-pilot.tpk2"
          test -s "$RUNNER_TEMP/battle-shots/bulbasaur/bulbasaur-walk.gif"
          ROOT="$PWD"
          OUT="$RUNNER_TEMP/battle-shots/bulbasaur"
          PY="$RUNNER_TEMP/portrait-venv/bin/python"
          cp tools/sdcard/mons/p001.bin "$RUNNER_TEMP/original-p001.bin"
          cd "$OUT"
          rm -f tamapoke.nvs
          "$ROOT/tools/emu/tamapoke-emu" --shot homewalkpilot --dex 1 --out baseline
          "$PY" "$ROOT/tools/merge_walk_pilot.py" "$RUNNER_TEMP/original-p001.bin" "$OUT/bulbasaur-pilot.tpk2" "$ROOT/tools/sdcard/mons/p001.bin"
          rm -f tamapoke.nvs
          "$ROOT/tools/emu/tamapoke-emu" --shot homewalkpilot --dex 1 --out articulated
          "$PY" -c 'from PIL import Image; from pathlib import Path; a=[Image.open(p).convert("RGB") for p in sorted(Path(".").glob("articulated-*.ppm"))]; b=[Image.open(p).convert("RGB") for p in sorted(Path(".").glob("baseline-*.ppm"))]; assert len(a)==len(b)==12; assert any(x.tobytes()!=y.tobytes() for x,y in zip(a,b)); a[0].save("living-room-walk.gif",save_all=True,append_images=a[1:],duration=80,loop=0); print("PASS: 12 real emulator comparison frames")'
          cp "$RUNNER_TEMP/original-p001.bin" "$ROOT/tools/sdcard/mons/p001.bin"
          rm -f tamapoke.nvs
      - uses: actions/upload-artifact@v4
        with:
          name: battle-visual-emulator-screens
          path: ${{ runner.temp }}/battle-shots/
          retention-days: 7

  firmware:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'codex/tamapoke-battle-scene-polish' || github.event.pull_request.head.ref == 'codex/tamapoke-hd-frame-fit'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned core and libraries
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "GFX Library for Arduino@1.6.9" SensorLib@0.5.1 XPowersLib@0.3.3 U8g2@2.36.19
      - name: Compile without publishing
        run: |
          mkdir -p "$RUNNER_TEMP/TamaPoke"
          tar --exclude=.git -cf - . | tar -xf - -C "$RUNNER_TEMP/TamaPoke"
          arduino-cli compile --warnings=all \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir "$RUNNER_TEMP/firmware-check" "$RUNNER_TEMP/TamaPoke"
          ls -lh "$RUNNER_TEMP/firmware-check"
