<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TamaPoke kids version - installer</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;line-height:1.6}
.box{background:#f4f1e4;border-radius:12px;padding:1rem 1.25rem;margin:1rem 0}</style></head>
<body>
<h1>TamaPoke kids version</h1>
<p>Use <b>Chrome or Edge</b> on a computer. Plug the board in with a USB-C <b>data</b> cable.</p>
<div class="box"><b>If no port shows up:</b> hold BOOT, tap RESET, let go of BOOT, then try again.</div>
<p><esp-web-install-button manifest="manifest.json"></esp-web-install-button></p>
<p>This keeps the saved pet and the SD card contents. Do not choose "erase".</p>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js"></script>
</body></html>
